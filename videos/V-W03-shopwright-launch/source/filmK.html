<style>

  color: var(--lime); font: 560 32px/1 Geist, sans-serif; box-shadow: 0 0 60px -10px rgba(200,255,0,.45), inset 0 0 30px rgba(200,255,0,.08); }

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1080), H = +(Q.get("h") || 1920);

const $ = (q, r = document) => r.querySelector(q);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const S0 = $("#s"); S0.style.width = W + "px"; S0.style.height = H + "px"; if (LAND) S0.classList.add("land");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const eOut = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const inOut3 = (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const out3 = (u) => 1 - Math.pow(1 - u, 3);
const in3 = (u) => u * u * u;
const cubic = (u) => u * u * (3 - 2 * u);
function spring(t, f = 2.4, z = .72) { if (t <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const show = (e, on) => { e.style.visibility = on ? "visible" : "hidden"; };
const pos = (e, x, y) => { e.style.left = x + "px"; e.style.top = y + "px"; };
const SH = Object.fromEntries(T.shots.map((s) => [s.id, s]));

// Frame: vertical uses the full frame; horizontal is a 2.39:1 band with the subtitles in the lower bar.
const BH = LAND ? Math.round((H - W / 2.39) / 2) : 0;
const M = LAND ? 150 : 80;
const shots = {};
for (const s of T.shots) { const d = el("div", "shot", S0); const cam = el("div", "cam", d); shots[s.id] = { d, cam, ...s }; }
const bg = (sh, css) => { const b = el("div", "full", shots[sh].d); b.style.background = css; shots[sh].d.insertBefore(b, shots[sh].cam); return b; };

// chapter heading (rises out of a mask)
function chapter(sh, word, small, x, y, size) {
  const c = el("div", "chapter", shots[sh].cam, `<span class="w"><span class="chrome">${word}</span></span><small>${small}</small>`);
  c.style.fontSize = size + "px"; pos(c, x, y); return c;
}
function chapterAt(c, t, t0) {
  const k = out3(seg(t, t0 + .1, t0 + .9)); $(".w span", c).style.transform = `translateY(${(1 - k) * 105}%)`;
  const s = eOut(seg(t, t0 + .5, t0 + 1.2)); $("small", c).style.opacity = s; $("small", c).style.transform = `translateY(${(1 - s) * 14}px)`;
}

// ---------- shot: open ----------
const OY = LAND ? H / 2 - 40 : 820;
const open = shots.open;
bg("open", `radial-gradient(ellipse 60% 30% at 50% ${OY / H * 100}%, rgba(200,255,0,.10), transparent 70%)`);
const oSoft = el("div", "streak soft", open.cam); oSoft.style.left = "0"; oSoft.style.right = "0"; oSoft.style.top = (OY - 30) + "px";
const oStreak = el("div", "streak", open.cam); oStreak.style.top = (OY - 3) + "px";
const oDot = el("div", "dot", open.cam);

// ---------- shot: name ----------
const name = shots.name;
const NY = LAND ? H / 2 - 130 : 760, NS = LAND ? 210 : 168;
bg("name", `radial-gradient(ellipse 70% 25% at 50% ${(NY + NS * .55) / H * 100}%, rgba(200,255,0,.07), transparent 70%)`);
const nEye = el("div", "eyebrow abs", name.cam, "FOR ETSY SELLERS");
const mk = (cls) => { const e = el("div", "abs " + cls, name.cam, "Shopwright"); Object.assign(e.style, { left: 0, right: 0, textAlign: "center", top: NY + "px", fontWeight: 720, fontSize: NS + "px", letterSpacing: "-.05em", lineHeight: 1.1, whiteSpace: "nowrap" }); return e; };
const nBase = mk(""); nBase.style.color = "#141416";
const nLit = mk("chrome");
const nHot = mk(""); nHot.style.background = "linear-gradient(180deg,#fff,#f6ffd6 50%,#e6ff80)"; nHot.style.webkitBackgroundClip = "text"; nHot.style.backgroundClip = "text"; nHot.style.color = "transparent";
const nStreak = el("div", "streak", name.cam); nStreak.style.top = (NY + NS * .62) + "px";
const nSub = el("div", "abs", name.cam, "Etsy 卖家工具站"); Object.assign(nSub.style, { left: 0, right: 0, textAlign: "center", top: (NY + NS * 1.42) + "px", fontSize: (LAND ? 48 : 44) + "px", fontWeight: 540, color: "#a1a1aa", letterSpacing: ".06em" });
const nDot = el("div", "dot", name.cam);

// ---------- shot: title ----------
const ti = shots.title;
bg("title", `radial-gradient(ellipse 70% 40% at ${LAND ? 70 : 30}% 55%, rgba(200,255,0,.10), transparent 70%), radial-gradient(ellipse 50% 30% at 85% 40%, rgba(150,200,255,.06), transparent 70%)`);
const tiCh = chapter("title", "标题。", "140 字符以内，不确定的先标出来。", M, LAND ? BH + 110 : 200, LAND ? 130 : 150);
const panelHTML = () => `<div class="bar"><i></i><i></i><i></i><span style="margin-left:14px">skill/listing · run 0428</span><b>● running</b></div>
  <div class="bd"><div class="lbl">INPUT</div>
  <div class="row"><span><b>›</b>product</span><span>Maple cake server set</span></div>
  <div class="row"><span><b>›</b>process</span><span>Laser engraving</span></div>
  <div class="row"><span><b>›</b>options</span><span>2 fonts · 3 woods</span></div>
  <div class="row"><span><b>›</b>unknown</span><span class="flag">Blade steel grade</span></div>
  <div class="lbl" style="margin-top:22px">OUTPUT</div>
  <div class="card"><div class="meta"><span>TITLE</span><em><i class="n">0</i>/140</em></div><p class="ttl"><span class="tx"></span><span class="caret"></span></p></div>
  <div class="card"><div class="meta"><span>TAGS</span><em><i>0</i>/13</em></div><div style="height:120px"></div></div></div>`;
const tiScene = el("div", "scene", ti.cam); Object.assign(tiScene.style, { left: 0, top: 0, width: W + "px", height: H + "px", perspective: "1800px", perspectiveOrigin: "50% 55%" });
const PX0 = LAND ? 820 : 120, PY0 = LAND ? BH + 70 : 600;
const pBlur = el("div", "panel refl", tiScene, panelHTML()); pos(pBlur, PX0, PY0); pBlur.style.filter = "blur(7px)"; pBlur.style.boxShadow = "inset 0 1px 0 rgba(255,255,255,.25)";
const pSharp = el("div", "panel", tiScene, panelHTML()); pos(pSharp, PX0, PY0);
pSharp.style.webkitMaskImage = "linear-gradient(180deg,transparent 46%,#000 53%,#000 67%,transparent 75%)";
$(".caret", pBlur).style.visibility = "hidden";
const tiSweep = el("div", "abs", ti.cam); tiSweep.style.display = "none";

// ---------- shot: tags ----------
const tg = shots.tags;
bg("tags", `radial-gradient(ellipse 70% 40% at 50% 58%, rgba(200,255,0,.08), transparent 70%)`);
const tgCh = chapter("tags", "标签。", "按 Etsy 上限，写满 13 个。", M, LAND ? BH + 110 : 200, LAND ? 130 : 150);
const tgScene = el("div", "scene", tg.cam); Object.assign(tgScene.style, { left: 0, top: 0, width: W + "px", height: H + "px", perspective: "1500px", perspectiveOrigin: LAND ? "68% 30%" : "50% 30%" });
const plane = el("div", "abs", tgScene); Object.assign(plane.style, { left: (LAND ? 820 : 70) + "px", top: (LAND ? BH + 150 : 640) + "px", width: "940px", height: "600px", transformStyle: "preserve-3d" });
const chipsEl = C.tags.map((t) => el("div", "chip", plane, t));
const tgCount = el("div", "count abs", tg.cam, `<i>0</i><span>/13</span>`); pos(tgCount, LAND ? M : M, LAND ? BH + 420 : 1240);
const tgDot = el("div", "dot", tg.cam);

// ---------- shot: profit ----------
const pr = shots.profit;
bg("profit", `radial-gradient(ellipse 80% 35% at ${LAND ? 66 : 50}% 60%, rgba(200,255,0,.09), transparent 70%)`);
const prCh = chapter("profit", "利润。", "每一笔费用，都算清。", M, LAND ? BH + 110 : 200, LAND ? 130 : 150);
const BW = 920, PXU = BW / 30;
const prScene = el("div", "scene", pr.cam); Object.assign(prScene.style, { left: (LAND ? 850 : 80) + "px", top: (LAND ? BH + 300 : 880) + "px", width: BW + "px", height: "200px", perspective: "1400px", perspectiveOrigin: "40% -40%" });
const prPlane = el("div", "abs", prScene); Object.assign(prPlane.style, { inset: 0, transform: "rotateX(48deg) rotateZ(-4deg)", transformStyle: "preserve-3d" });
let xr = BW;
const segs = C.cuts.map((c) => { xr -= c.usd * PXU; const e = el("div", "pseg", prPlane); e.style.left = xr + "px"; e.style.width = (c.usd * PXU - 2) + "px"; return { ...c, e, x: xr, w: c.usd * PXU }; });
const PROFIT_W = xr;
const prLime = el("div", "pseg", prPlane); Object.assign(prLime.style, { left: 0, borderRadius: "14px 6px 6px 14px", background: "linear-gradient(180deg,#e2ff6a,#c8ff00 55%,#9fd000)" });
const prDot = el("div", "dot", prPlane);
const prLab = el("div", "abs", pr.cam, `$30.00 ORDER → WHAT'S LEFT`); Object.assign(prLab.style, { font: "500 24px/1 var(--mono)", color: "#6b6b73", letterSpacing: ".18em" }); pos(prLab, LAND ? M : 80, LAND ? BH + 430 : 1120);
const prAmt = el("div", "abs", pr.cam); pos(prAmt, LAND ? M - 6 : 74, LAND ? BH + 470 : 1160); prAmt.style.height = "150px"; prAmt.style.width = "800px"; prAmt.style.overflow = "hidden";
const prA = el("div", "amt w abs", prAmt), prB = el("div", "amt w abs", prAmt);
const prPct = el("div", "abs", pr.cam, "利润率 30.5%"); Object.assign(prPct.style, { font: "500 30px/1 var(--mono)", color: "#c8ff00" }); pos(prPct, LAND ? M : 80, LAND ? BH + 620 : 1310);
const prFoot = el("div", "abs", pr.cam, "示例：售价 $25 + 买家运费 $5 · 收款地中国 · 汇率 7.10 · 成本 ¥40 / 包装 ¥5 / 物流 ¥70 · 网站利润计算器默认示例");
Object.assign(prFoot.style, { font: "400 18px/1.5 var(--mono)", color: "#4a4a52", width: (LAND ? 1000 : 920) + "px" }); pos(prFoot, LAND ? 850 : 80, LAND ? H - BH - 70 : 1700);
const segColor = { etsy: "#ffb224", fx: "#7c8db5", cost: "#5f5f68" };

// ---------- shot: pipe ----------
const pp = shots.pipe;
bg("pipe", `radial-gradient(ellipse 70% 60% at 65% 60%, rgba(200,255,0,.10), transparent 70%), linear-gradient(180deg,#0b0c0a,#060606)`);
const ppCh = chapter("pipe", "上架。", "从选品到上架，一条流水线。", M, LAND ? BH + 110 : 200, LAND ? 130 : 150);
const ppScene = el("div", "scene", pp.cam); Object.assign(ppScene.style, { left: 0, top: 0, width: W + "px", height: H + "px", perspective: "1300px", perspectiveOrigin: LAND ? "55% 50%" : "20% 50%" });
const ppRow = el("div", "abs", ppScene); Object.assign(ppRow.style, { left: (LAND ? 700 : 120) + "px", top: (LAND ? 480 : 860) + "px", transformOrigin: "0 50%", transformStyle: "preserve-3d" });
const STEP = 330;
const ppLine = el("div", "abs", ppRow); Object.assign(ppLine.style, { left: "55px", top: "54px", width: 6 * STEP + "px", height: "3px", background: "rgba(200,255,0,.16)" });
const ppLit = el("div", "abs", ppRow); Object.assign(ppLit.style, { left: "55px", top: "54px", height: "3px", background: "#c8ff00", boxShadow: "0 0 20px rgba(200,255,0,.8)" });
const ppNodes = C.pipeline.map((n, i) => { const w = el("div", "abs", ppRow, `<div class="node">${String(i + 1).padStart(2, "0")}</div><div class="nl">${n}</div>`); pos(w, i * STEP, 0); return w; });
const ppDot = el("div", "dot", ppRow);

// ---------- shot: montage ----------
const mo = shots.montage;
const moA = el("div", "abs", mo.cam), moB = el("div", "abs", mo.cam), moC = el("div", "abs", mo.cam);
[moA, moB, moC].forEach((e) => { e.style.inset = "0"; });
{ // A: workbench board (site's demo modules)
  const bw = LAND ? 520 : 440, bh = 130, gx = 24, x0 = LAND ? (W - 2 * bw - gx) / 2 : (W - 2 * bw - gx) / 2, y0 = LAND ? BH + 170 : 640;
  el("div", "eyebrow abs", moA, "ETSY WORKBENCH").style.cssText += `left:${x0}px;top:${y0 - 60}px`;
  C.board.forEach(([k, n], i) => { const c = el("div", "bcard" + (k === "SKILL" ? " sk" : ""), moA, `<em>${k}</em><strong>${n}</strong>`);
    Object.assign(c.style, { left: x0 + (i % 2) * (bw + gx) + "px", top: y0 + Math.floor(i / 2) * (bh + gx) + "px", width: bw + "px", height: bh + "px" }); });
}
{ // B: free tools with the two real check results
  const pw = LAND ? 1000 : 920, x0 = (W - pw) / 2, y0 = LAND ? BH + 120 : 560;
  el("div", "eyebrow abs", moB, "FREE ETSY TOOLS · NO SIGN-UP").style.cssText += `left:${x0}px;top:${y0 - 60}px`;
  const badge = { 2: "74/140 ✓", 3: "13/13 ✓" };
  C.tools.forEach((n, i) => { const p = el("div", "pill" + (badge[i] ? " on" : ""), moB, `<span>${n}</span>${badge[i] ? `<b>${badge[i]}</b>` : '<span style="color:#55555c">↗</span>'}`);
    Object.assign(p.style, { left: x0 + "px", top: y0 + i * (LAND ? 96 : 112) + "px", width: pw + "px", height: (LAND ? 82 : 96) + "px" }); });
}
{ // C: the finished listing title
